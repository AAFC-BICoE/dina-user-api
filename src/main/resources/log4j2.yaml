
Configuration:
  name: dina

  Properties:
    Property:
      name: log-path
      value: "logs"
  
  Appenders:
    Console:
      name: LogToConsole
      target: SYSTEM_OUT
      PatternLayout:
        pattern: "%d [%t] %-5p %c - %m%n"
# To also log to a file, uncomment this appender and the LogToFile ref below.
# The log directory must be writable (e.g. in a container, create it for the non-root user).
#    File:
#      name: LogToFile
#      fileName: ${log-path}/app.log
#      PatternLayout:
#        pattern: "%d [%t] %-5p %c - %m%n"

  Loggers:
      Logger:
        - name: ca.gc.aafc
          additivity: false
          level: INFO
          AppenderRef:
            - ref: LogToConsole
#            - ref: LogToFile
      Root:
          level: WARN
          AppenderRef:
            - ref: LogToConsole

